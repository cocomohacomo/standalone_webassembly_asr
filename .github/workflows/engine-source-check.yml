name: Verify private ASR engine checkout

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/clone-engine.sh"
      - "scripts/build-wasm.sh"
      - "wasm/**"
      - ".github/workflows/engine-source-check.yml"
      - "engine/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Fetch pinned private C++ engine
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/clone-engine.sh
          ./scripts/clone-engine.sh

      - name: Verify pinned revision and checkout integrity
        shell: bash
        run: |
          set -euo pipefail
          expected="36f8a71e3ed0ea43ca2d9058f62dc0c359e6e04e"
          actual="$(git -C vendor/sherpa-embed-asr rev-parse HEAD)"
          test "$actual" = "$expected"
          test "$(git -C vendor/sherpa-embed-asr rev-parse --is-inside-work-tree)" = "true"
          echo "Pinned engine checkout verified: $actual"
          echo "Upstream working tree status:"
          git -C vendor/sherpa-embed-asr status --short
