name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static app shell
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon.svg
          test -s web/wasm/asr-worker.js
          test -s web/wasm/pcm-worklet.js
          node --check app.js
          node --check sw.js
          node --check web/wasm/asr-worker.js
          node --check web/wasm/pcm-worklet.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest["start_url"] == "./"
          assert manifest["scope"] == "./"
          assert manifest["display"] == "standalone"
          for icon in manifest["icons"]:
              assert Path(icon["src"]).is_file(), icon["src"]
          print("PWA manifest, JavaScript syntax, and app-shell files validated")
          PY

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Fetch pinned private ASR engine
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          chmod +x scripts/clone-engine.sh
          ./scripts/clone-engine.sh

      - name: Build browser WASM runtime
        shell: bash
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          chmod +x scripts/build-sherpa-onnx-wasm.sh scripts/build-wasm.sh
          ./scripts/build-wasm.sh
          mkdir -p web/wasm/dist
          cp build-wasm/sherpa_embed_asr_wasm.js build-wasm/sherpa_embed_asr_wasm.wasm web/wasm/dist/
          test -s web/wasm/dist/sherpa_embed_asr_wasm.js
          test -s web/wasm/dist/sherpa_embed_asr_wasm.wasm
          node --check web/wasm/dist/sherpa_embed_asr_wasm.js

      - name: Assemble and validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          # Publish only runtime assets. Never archive the checkout, source vendor,
          # compiler output, or mutable dependency caches.
          rm -rf _site
          install -d _site/web/wasm/dist
          install -m 0644 index.html app.js sw.js manifest.webmanifest icon.svg _site/
          install -m 0644 web/wasm/asr-worker.js web/wasm/pcm-worklet.js _site/web/wasm/
          install -m 0644 web/wasm/dist/sherpa_embed_asr_wasm.js web/wasm/dist/sherpa_embed_asr_wasm.wasm _site/web/wasm/dist/
          : > _site/.nojekyll

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site")
          required = [
              "index.html",
              "app.js",
              "sw.js",
              "manifest.webmanifest",
              "icon.svg",
              "web/wasm/asr-worker.js",
              "web/wasm/pcm-worklet.js",
              "web/wasm/dist/sherpa_embed_asr_wasm.js",
              "web/wasm/dist/sherpa_embed_asr_wasm.wasm",
              ".nojekyll",
          ]
          for name in required:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, f"Missing/empty artifact file: {name}"

          manifest = json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          for icon in manifest["icons"]:
              assert (root / icon["src"].removeprefix("./")).is_file(), icon["src"]

          app = (root / "app.js").read_text(encoding="utf-8")
          shell = (root / "sw.js").read_text(encoding="utf-8")
          assert '"./web/wasm/asr-worker.js"' in shell
          assert '"./web/wasm/pcm-worklet.js"' in shell
          assert "./web/wasm/asr-worker.js" in app
          assert "./web/wasm/pcm-worklet.js" in app
          assert "./web/wasm/dist/sherpa_embed_asr_wasm.js" in app

          forbidden = {".cache", "vendor", "build-wasm", ".git", "node_modules"}
          present = forbidden.intersection(path.name for path in root.iterdir())
          assert not present, f"Build/cache directories leaked into Pages artifact: {sorted(present)}"
          print(f"Pages artifact validated: {len(required)} required files, {sum(1 for p in root.rglob('*') if p.is_file())} files total")
          PY

          node --check _site/app.js
          node --check _site/sw.js
          node --check _site/web/wasm/asr-worker.js
          node --check _site/web/wasm/pcm-worklet.js
          node --check _site/web/wasm/dist/sherpa_embed_asr_wasm.js
          du -ah _site | sort -h | tail -20

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
