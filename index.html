<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10241f">
  <meta name="description" content="端末内で録音し、文字起こしを保存するオフライン対応音声メモ。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>声メモ | Offline ASR</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1514;--panel:#152321;--line:#29413b;--muted:#9ab1a8;--green:#8de0b5;--text:#edf6f1;--red:#ff8c86}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -20%,#23453a 0%,var(--bg) 65%);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100dvh}
    main{max-width:680px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 24px}.brand{font-weight:800;font-size:20px;letter-spacing:.02em}.brand span{color:var(--green)}.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted)}
    .card{background:rgba(21,35,33,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 14px 40px #0002}
    .status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#71827c}.dot.active{background:#ff6f66;box-shadow:0 0 12px #ff6f6680;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.4}}
    .timer{text-align:center;font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;margin:12px 0 8px}.controls{display:flex;justify-content:center;gap:12px;margin:18px 0 8px}.btn{border:1px solid var(--line);background:#223a34;color:var(--text);border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;min-height:52px;cursor:pointer}.btn.primary{background:var(--green);color:#10241d;border:0;min-width:150px}.btn:disabled{opacity:.45;cursor:default}.btn.install{min-height:36px;padding:6px 12px;font-size:12px;border-color:var(--green);color:var(--green)}.hint{font-size:13px;color:var(--muted);margin:10px 0 0}.section-title{font-size:15px;font-weight:700;margin:0 0 12px}.textarea{width:100%;min-height:180px;resize:vertical;background:#0e1917;border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font:inherit;line-height:1.7;outline:none}.textarea:focus{border-color:var(--green)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row .btn{flex:1;font-size:14px;padding:11px}.history-item{padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.history-item:first-child{border-top:0}.history-item button{border:0;background:transparent;color:var(--green);font:inherit;cursor:pointer}.notice{border-left:3px solid #d8b56b;padding:10px 12px;background:#2b271b;border-radius:8px;color:#e5d4a5;font-size:13px;margin-top:12px}.hide{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;margin:22px 0}a{color:var(--green)}
  </style>
</head>
<body>
<main>
<header><div class="brand">声<span>メモ</span></div><button class="btn install" id="installBtn" hidden>アプリをインストール</button><span class="chip" id="connection">準備中</span></header>
<div class="card">
  <div class="status"><span class="dot" id="recordDot"></span><span id="statusText">録音待機中</span></div>
  <div class="timer" id="timer">00:00</div>
  <div class="controls"><button class="btn primary" id="recordBtn">● 録音開始</button><button class="btn" id="stopBtn" disabled>■ 停止</button></div>
  <p class="hint" id="audioHint">録音音声はこの端末内で保存します。マイクの許可が必要です。</p>
  <div id="transcriptionNotice" class="notice">初回は日本語モデル（約180MB）をダウンロードします。以後は端末内キャッシュからオフライン利用できます。WASM本体の配備が必要です。</div>
  <div id="speechNotice" class="notice hide">ブラウザの音声認識を試しています。これはオンライン認識の場合があり、オフラインWASM認識ではありません。</div>
</div>
<div class="card">
  <p class="section-title">文字起こし</p>
  <textarea class="textarea" id="text" placeholder="認識結果やメモをここに入力・編集できます…" aria-label="文字起こしテキスト"></textarea>
  <div class="row"><button class="btn" id="copyBtn">コピー</button><button class="btn" id="exportBtn">TXT保存</button><button class="btn" id="saveBtn">履歴に保存</button></div>
</div>
<div class="card">
  <p class="section-title">録音データ</p>
  <audio id="audio" controls class="hide" style="width:100%"></audio>
  <div class="row"><button class="btn" id="downloadAudioBtn" disabled>録音を保存</button><button class="btn" id="clearBtn">クリア</button></div>
  <p class="hint">録音ファイルは保存ボタンから端末へダウンロードできます。</p>
</div>
<div class="card">
  <p class="section-title">保存したメモ</p>
  <div id="history"><p class="hint">保存した履歴はここに表示されます。</p></div>
</div>
<footer>Offline-first prototype · 音声データは外部送信しません（録音機能）</footer>
</main>
<script src="./app.js"></script>
</body></html>
